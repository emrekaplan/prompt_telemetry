[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlog"
version = "1.0.0"
description = "Per-prompt telemetry for Claude Code and GitHub Copilot, stored in local SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentlog = "agentlog.cli:main"

[tool.setuptools]
packages = ["agentlog"]

[tool.setuptools.package-data]
agentlog = ["prices.csv"]
