[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt_telemetry"
version = "1.0.0"
description = "Per-prompt telemetry for Claude Code and GitHub Copilot, stored in local SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prompt_telemetry = "prompt_telemetry.cli:main"

[tool.setuptools]
packages = ["prompt_telemetry"]

[tool.setuptools.package-data]
prompt_telemetry = ["prices.csv"]
